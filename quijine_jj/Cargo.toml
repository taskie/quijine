[package]
name = "quijine_jj"
version = "0.1.0"
authors = ["taskie <t@skie.jp>"]
license = "MIT/Apache-2.0"
keywords = ["json", "javascript", "quickjs"]
readme = "README.md"
repository = "https://github.com/taskie/quijine/tree/main/quijine_jj"
categories = ["command-line-utilities"]
description = "Genuine JavaScript Object Notation processor using QuickJS."
edition = "2021"

[[bin]]
name = "jj"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
atty = "0.2.14"
colored_json = "5.0"
env_logger = "0.11"
log = "0.4.29"
quijine = { path = "../" }
serde = "1.0.228"
serde_quijine = { path = "../serde_quijine" }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
thiserror = "2.0"
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.2"
