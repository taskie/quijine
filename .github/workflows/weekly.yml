name: weekly

on:
  schedule:
    - cron: '28 19 * * 6'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1
  LIB_PACKAGES: -p quijine -p quijine_core -p serde_quijine

jobs:
  check-oldest:
    name: Check Oldest (libs)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.65.0  # MSRV
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
      - run: cargo +nightly update -Z minimal-versions
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test ${{ env.LIB_PACKAGES }} --locked -- --nocapture
  check-latest:
    name: Check Latest (libs)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - beta
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo update
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test ${{ env.LIB_PACKAGES }} --locked -- --nocapture
  check-jj:
    name: Check quijine_jj
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - beta
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo install --path quijine_jj --locked
      - run: jj --version
      - run: jj --help
      - run: cargo test -p quijine_jj --locked -- --nocapture
